# Supabase CLI project config (local development: `supabase start`).
project_id = "abs-fitness"

[api]
schemas = ["public"]
max_rows = 1000

[auth]
site_url = "https://my.example.com"
jwt_expiry = 3600
# Staff sessions last 30 days via refresh tokens.
enable_refresh_token_rotation = true

# The app returns here after Google sign-in on Android and iOS.
additional_redirect_urls = ["com.absfitnesszone.app://login-callback"]

# Google is the only way in: no email/password or magic-link logins.
[auth.email]
enable_signup = false
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Optional: refuse sign-ups from Gmails the gym doesn't know (see README).
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/public/hook_before_user_created"

[functions.razorpay-link]
verify_jwt = true

[functions.razorpay-webhook]
verify_jwt = false

# WhatsApp API mode (F8). Both check their own secret: the cron secret or a
# desk JWT for send, Meta's signature for the webhook.
[functions.whatsapp-send]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false
