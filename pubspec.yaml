name: abs_fitness
description: "ABS Fitness Zone gym management app (Owner, Front desk, Trainer, Member)."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.2
  supabase_flutter: ^2.18.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_animate: ^4.5.2
  animations: ^3.0.0
  skeletonizer: ^3.0.0
  fl_chart: ^1.3.0
  intl: ^0.20.3
  sentry_flutter: ^10.3.0
  shared_preferences: ^2.5.6
  flutter_localizations:
    sdk: flutter
  phosphor_icons: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-Sora.txt

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    # Just the ₹ glyph (Sora has none; the bundled Inter files are Latin-only).
    - family: AbsRupee
      fonts:
        - asset: assets/fonts/InterRupee-Regular.ttf
          weight: 400
        - asset: assets/fonts/InterRupee-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterRupee-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterRupee-Bold.ttf
          weight: 700
