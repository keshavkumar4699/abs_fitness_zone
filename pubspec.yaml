name: abs_fitness
description: "ABS Fitness Zone gym management app (Owner, Front desk, Trainer, Member)."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.2
  supabase_flutter: ^2.18.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_animate: ^4.5.2
  animations: ^3.0.0
  skeletonizer: ^3.0.0
  fl_chart: ^1.3.0
  intl: ^0.20.3
  sentry_flutter: ^10.3.0
  shared_preferences: ^2.5.6
  flutter_localizations:
    sdk: flutter
  phosphor_icons: ^3.0.1
  url_launcher: ^6.3.3
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  file_picker: ^13.3.2
  csv: ^8.0.0
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  pdf: ^3.13.1
  printing: ^5.15.1
  path_provider: ^2.1.6
  cached_network_image: ^4.0.6
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/OFL-baloo-2.txt
    - assets/fonts/OFL-nunito.txt
    - assets/fonts/OFL-noto-sans-devanagari.txt

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    # Hindi (food names now, the Hindi UI later): the Latin fonts above have
    # no Devanagari, so every style falls back to this.
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
