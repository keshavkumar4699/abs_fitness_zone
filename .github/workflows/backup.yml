name: Nightly backup

# 02:00 IST = 20:30 UTC. pg_dump → the gym's Google Drive (via rclone).
# Keeps 30 daily and 12 monthly dumps.
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "::warning::SUPABASE_DB_URL / RCLONE_CONFIG_B64 not configured; skipping backup"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Install tools
        if: env.SKIP != '1'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client-17 rclone
      - name: Dump and upload
        if: env.SKIP != '1'
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_B64" | base64 -d > ~/.config/rclone/rclone.conf
          STAMP=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          FILE="abs-fitness-$STAMP.dump"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --file "$FILE"
          rclone copy "$FILE" gdrive:abs-fitness-backups/daily/
          if [ "$(TZ=Asia/Kolkata date +%d)" = "01" ]; then
            rclone copy "$FILE" gdrive:abs-fitness-backups/monthly/
          fi
          rclone delete gdrive:abs-fitness-backups/daily/ --min-age 30d
          rclone delete gdrive:abs-fitness-backups/monthly/ --min-age 365d
