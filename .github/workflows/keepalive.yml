name: Supabase keep-alive

# Free Supabase projects pause after 7 idle days; ping every 6 hours.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - run: |
          if [ -z "$SUPABASE_URL" ]; then echo "::warning::SUPABASE_URL not set"; exit 0; fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/public_gym_profile" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}' > /dev/null
